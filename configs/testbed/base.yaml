notes:
  transmission_format_limitations: 'BetterGrids currently exposes the official Texas7k
    bundle as a PowerWorld PWB archive plus the load/generator mapping workbook. If
    a parseable MATPOWER/RAW export is unavailable during the automated run, the pipeline
    falls back to a subtransmission/interface representation anchored by SMART-DS
    substation buses and documents the limitation explicitly.

    '
  v0_1_cleanup_notes: 'baseline_case_v0_1 preserves the audited topology, clarifies
    physical versus equivalent edge roles, keeps schematic source and data-center
    service connections non-damageable, and adds optional data-center scenario overlays
    without rebuilding the core T-D graph.

    '
