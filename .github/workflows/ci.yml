name: Lightweight validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      matrix:
        mapping: [false, true]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.runtime/matplotlib
      DC_RESTORATION_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verified staging dependencies and package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e ".[dev]"
          python -m pip check
      - name: Install optional mapping dependencies
        if: matrix.mapping
        run: |
          python -m pip install -r requirements-mapping-lock.txt
          python -m pip check
      - name: Check formatting and unresolved names
        run: |
          python -m ruff check src scripts tests
          python -m ruff format --check src scripts tests
      - name: Check imports and tiny fixture
        run: python scripts/validate_installation.py
      - name: Run fast tests
        run: python -m pytest --basetemp=.runtime/pytest
      - name: Build the package without downloading research inputs
        run: python -m build --no-isolation --outdir .runtime/dist
